# Declared candidates for the 2027 French presidential election.
#
# Scope: people who publicly and explicitly announced their candidacy,
# as reported by at least one media outlet. Rumoured or undecided
# figures live in data/watchlist.yaml until they declare.
#
# The official list is only fixed by the Conseil constitutionnel after
# the 500 sponsorships ("parrainages") are validated, in spring 2027.
#
# Conventions:
#   - Keys are in English, values in French.
#   - Dates use ISO 8601 (YYYY-MM-DD). Age is derived from birth_date.
#   - `party` and `supporting_parties` reference ids in data/parties.yaml.
#   - null means "not verified yet", never "does not exist".
#   - `verification.to_verify` lists the fields still needing a check
#     against a primary source.
#
# Candidacy status values:
#   declared                personal announcement
#   invested                designated by a party vote or a primary
#   sponsorships_validated  on the official Conseil constitutionnel list
#   withdrawn               candidacy abandoned (record kept for history)

